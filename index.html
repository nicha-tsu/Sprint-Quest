<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sprint Quest · TSU</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first game app — sticky status bar, board grid, one action card that changes with the game phase, sheets slide up for cards/rules */
:root{
  --bg:#EEF1F4;--surface:#fff;--ink:#14222E;--muted:#56687A;--line:#D3DBE3;--soft:#F5F7F9;
  --accent:#1F78C1;--accent-ink:#fff;--accent2:#E8800F;--brand-soft:#E6F1FA;
  --k:#2B63D9;--ks:#E3ECFC;--e:#C93C0C;--es:#FBE4D8;--s:#2A7F3E;--ss:#DFF1E3;--d:#6A44D4;--ds:#ECE6FB;--g:#A87400;--gs:#FBF0D4;
  --good:#1F7A3A;--bad:#B83A0E;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F181E;--surface:#17232B;--ink:#E6EDF1;--muted:#9AAEBB;--line:#2C3D48;--soft:#1D2A33;--accent:#5AA9E6;--accent-ink:#06182A;--accent2:#F7A64A;--brand-soft:#16324A;
  --k:#82A8FF;--ks:#1A2A47;--e:#FF8A5C;--es:#3A1F15;--s:#6FCB83;--ss:#15301D;--d:#B39CFF;--ds:#2A2148;--g:#F0C04A;--gs:#3A2E10;--good:#6FCB83;--bad:#FF8A5C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F181E;--surface:#17232B;--ink:#E6EDF1;--muted:#9AAEBB;--line:#2C3D48;--soft:#1D2A33;--accent:#5AA9E6;--accent-ink:#06182A;--accent2:#F7A64A;--brand-soft:#16324A;
  --k:#82A8FF;--ks:#1A2A47;--e:#FF8A5C;--es:#3A1F15;--s:#6FCB83;--ss:#15301D;--d:#B39CFF;--ds:#2A2148;--g:#F0C04A;--gs:#3A2E10;--good:#6FCB83;--bad:#FF8A5C;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
button{font-family:var(--display);font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.big{font-size:18px;padding:14px 20px;width:100%}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-height:44px}
.code-in{font-family:var(--display);font-size:28px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--surface);white-space:nowrap}
.hero{padding-block:22px 6px}
.hero h1{font-size:clamp(30px,8vw,44px)}
.hero h1 span{color:var(--accent2)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 10px;background:var(--soft);border-radius:0 8px 8px 0}
.warn{border-left-color:var(--bad)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.tline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tname{font-family:var(--display);font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:var(--display);font-weight:700;letter-spacing:.15em;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 8px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px 4px;text-align:center;min-width:0}
.st b{display:block;font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.st.m span{color:var(--g)}.st.s span{color:var(--k)}.st.b span{color:var(--e)}.st.o span{color:var(--s)}
.st.flash{animation:fl .8s ease}
@keyframes fl{0%{background:var(--accent);}100%{background:var(--surface)}}
/* board */
.board{display:grid;gap:4px;margin-top:10px}
.lane{display:grid;grid-template-columns:22px repeat(10,1fr);gap:3px;align-items:stretch}
.ln{font-family:var(--display);font-weight:700;font-size:11px;color:var(--muted);display:grid;place-items:center;writing-mode:vertical-rl;transform:rotate(180deg)}
.lane.cur .ln{color:var(--accent)}
.cell{position:relative;aspect-ratio:1;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(12px,3.6vw,18px);padding:0;min-height:0;min-width:0}
.cell .n{position:absolute;top:1px;left:3px;font-size:8.5px;font-weight:600;color:var(--muted);font-family:var(--body)}
.cell.K{background:var(--ks);border-color:var(--k);color:var(--k)}.cell.E{background:var(--es);border-color:var(--e);color:var(--e)}
.cell.S{background:var(--ss);border-color:var(--s);color:var(--s)}.cell.D{background:var(--ds);border-color:var(--d);color:var(--d)}
.cell.P{color:var(--accent);border-color:var(--ink)}.cell.R{color:var(--accent);border:2.5px solid var(--accent)}
.cell.past{opacity:.45}
.pawn{position:absolute;inset:auto auto -4px -4px;width:clamp(14px,4vw,20px);height:clamp(14px,4vw,20px);border-radius:50%;background:var(--accent);border:2.5px solid var(--surface);box-shadow:0 0 0 2px var(--accent)}
.cell.here{box-shadow:0 0 0 3px var(--accent);z-index:1}
.rolls{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.rolls i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink)}
.rolls i.on{background:var(--accent);border-color:var(--accent)}
/* phase card */
.phase h2{font-size:20px}
.ph-tag{font-family:var(--display);font-weight:700;font-size:13px;color:var(--accent2);letter-spacing:.04em}
.turn{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 10px;margin:10px 0}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:13px}
.die{width:58px;height:58px;border-radius:14px;border:3px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:3px;background:var(--surface);box-shadow:0 4px 0 var(--ink)}
.die i{border-radius:50%}.die i.on{background:var(--ink)}
.die.roll{animation:sh .5s ease}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-6px)}75%{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){.die.roll,.st.flash{animation:none}}
.bl{display:grid;gap:6px}
.bi{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 8px;font-size:14px}
.bi.in{background:var(--gs);outline:1.5px solid var(--g)}
.bi.done{opacity:.55;text-decoration:line-through}
.bi .no{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.bi .sp{font-family:var(--display);font-weight:700}
.bi button{min-height:32px;padding:2px 8px;font-size:13px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;align-items:start;width:100%}
.opt .ab{width:28px;height:28px;border-radius:50%;background:var(--e);color:#fff;display:grid;place-items:center;font-family:var(--display)}
.fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fx span{font-family:var(--body);font-size:12px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.qcard{border-radius:14px;border:2px solid var(--c);overflow:hidden;margin-top:10px}
.qcard .qh{background:var(--c);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:14px}
.qcard .qb{padding:12px;display:grid;gap:8px}
.qcard .qt{font-family:var(--display);font-weight:700;font-size:18px}
.ans{display:grid;gap:8px}
.ans button{text-align:left;justify-content:flex-start;display:flex;gap:10px;align-items:center;font-family:var(--body);font-weight:500}
.ans button .L{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--k);color:var(--k);display:grid;place-items:center;font-weight:700}
.ans button.ok{border-color:var(--good);background:var(--ss)}
.ans button.no{border-color:var(--bad);background:var(--es)}
.res{border-radius:10px;padding:10px 12px;font-weight:600}
.res.good{background:var(--ss);color:var(--good)}.res.bad{background:var(--es);color:var(--bad)}.res.neu{background:var(--soft)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quad button{min-height:62px;font-size:14px}
.timer{font-family:var(--display);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums}
.players{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pl{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.pl.turnp{outline:2.5px solid var(--accent)}
.pl.off{opacity:.45}
.pl .av{width:24px;height:24px;font-size:11px}
.log{margin-top:12px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.log div::before{content:"• ";color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar button{font-size:12.5px;padding:6px 4px;min-height:48px;line-height:1.2}
/* sheet */
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(8,14,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:min(760px,100%);max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.roles button{text-align:left;font-size:13.5px;padding:8px 10px;display:grid;gap:0}
.roles button small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:11.5px}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.roles button[aria-pressed="true"] small{color:var(--bg)}
.roles button.taken:not([aria-pressed="true"]){opacity:.5}
.projs{display:grid;gap:6px}
.modes button{text-align:left;display:grid;gap:2px;font-size:14px;padding:10px 12px}
.modes button small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:11.5px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.modes button[aria-pressed="true"] small{color:var(--bg)}
.dodbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;display:grid;gap:6px;background:var(--soft)}
.dodbox h3{margin:0;font-size:16px}
.dodbox ol{margin:0;padding-left:1.3em;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0;cursor:pointer}
.chk input{width:22px;height:22px;min-height:22px;flex:none;margin:0}
.goalbar{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--soft);border:1px dashed var(--accent);font-size:14px}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stars button{padding:8px 2px;font-size:13px;line-height:1.25;display:grid;gap:2px}
.stars button small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.sndfab{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:31;width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;font-size:20px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
body:has(.bar) .sndfab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.tflash::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;border:8px solid var(--bad);animation:tfl .5s 5 alternate}
@keyframes tfl{from{opacity:1}to{opacity:.15}}
#celeb{position:fixed;inset:0;z-index:60;background:rgba(10,18,24,.72);display:grid;place-items:center;padding:16px;overflow:hidden}
#celeb .conf span{position:absolute;top:-60px;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(115vh) rotate(540deg)}}
#celeb .cbox{position:relative;background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 18px;width:min(440px,100%);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#celeb .ctro{font-size:68px;line-height:1;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-8px) rotate(6deg)}}
#celeb h2{font-family:var(--display);font-size:30px;margin:6px 0 2px}
#celeb .pod{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;margin-top:8px;background:var(--soft);border:1px solid var(--line)}
#celeb .pod.p0{border:2px solid #D4A017;background:rgba(212,160,23,.12)}
#celeb .md{font-size:32px}#celeb .pn{display:grid}#celeb .pn small{color:var(--muted);font-size:12px}
#celeb .ps{font-family:var(--display);font-size:26px;font-weight:700}
@media (prefers-reduced-motion:reduce){#celeb .conf span,#celeb .ctro,#celeb .cbox,body:has(.bar) .sndfab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.tflash::after{animation:none}#celeb .conf{display:none}}
.proj{display:grid;grid-template-columns:1fr auto;gap:6px}
.proj .pb{text-align:left;font-size:14px;padding:9px 11px;display:grid;gap:1px}
.proj .pb small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:11.5px}
.proj .pb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.proj .pb[aria-pressed="true"] small{color:var(--bg)}
.proj .pb:disabled{opacity:.45}
.proj .pv{min-height:40px;padding:4px 12px;font-size:13px}
.blist{margin:6px 0 0;padding-left:20px}
.blist li{margin:3px 0}
.pow{background:var(--gs);border-radius:10px;padding:10px 12px}
.score td,.score th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.score{border-collapse:collapse;width:100%}
.score td.r{text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;max-width:90%;text-align:center}
.wait{display:inline-block;width:14px;height:14px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:380px){.stats{grid-template-columns:repeat(3,1fr)}}

/* ---- TSU brand, modules, CPM, portfolio ---- */
.top{border-bottom:3px solid var(--accent)}
.top::after{content:"";display:block;height:3px;background:var(--accent2);margin:8px -12px -11px;opacity:.9}
.tsulogo{display:inline-block;vertical-align:middle;aspect-ratio:113/75}
.tsulogo svg{height:100%;width:auto;display:block}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand b{font-family:var(--display);color:var(--accent);font-size:15px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.credit{margin:22px auto 0;max-width:760px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6;display:grid;justify-items:center;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mods button{display:grid;text-align:left;gap:2px;min-height:76px;align-content:start}
.mods button .mch{font-size:11px;color:var(--accent2);font-weight:700}
.mods button small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.mods button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mods button[aria-pressed="true"] small,.mods button[aria-pressed="true"] .mch{color:#fff}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stages span{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.stages span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stages span.done{background:var(--brand-soft);color:var(--accent);border-color:transparent}
.wrow{display:grid;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.wseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.wseg button{min-height:38px;padding:4px 6px;font-size:12.5px;font-family:var(--body)}
.wseg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wseg button.right{background:var(--ss);border-color:var(--good);color:var(--good);opacity:1}
.wseg button.wrong{background:var(--es);border-color:var(--bad);color:var(--bad);opacity:1}
.qrow{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{min-width:46px}
.chips button[aria-pressed="true"],.fib button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
svg.net,svg.gantt{width:100%;height:auto;margin-top:10px;color:var(--muted);background:var(--soft);border-radius:12px}
.net .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.net .ncr rect{fill:var(--accent2);stroke:var(--accent2)}
.net text{fill:var(--ink);font-family:var(--body)}
.net .ncr text{fill:#fff}
.net .nid{font-weight:700;font-size:16px}.net .nd2{font-size:11px}
.net .ed{stroke:var(--muted);stroke-width:1.4}.net .ecr{stroke:var(--accent2);stroke-width:3;color:var(--accent2)}
.gantt .gl{stroke:var(--line);stroke-width:.6}.gantt .gt{font-size:11px;fill:var(--muted)}
.gantt .gn{font-size:12.5px;fill:var(--ink);font-family:var(--body)}
.gantt .gb{fill:var(--accent)}.gantt .gcr{fill:var(--accent2)}.gantt .gfl{fill:var(--accent);opacity:.18}
.formula{font-family:var(--display);font-size:20px;text-align:center;padding:8px;border-radius:10px;background:var(--brand-soft);color:var(--accent);margin-top:8px}

.cards{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

/* ---- teaching mode & worksheets ---- */

.acct{border-color:var(--accent)}

const fxText=f=>{if(!f)return[];const o=[];if(f.c)o.push(`สัญญา ${f.c>0?"+":"−"}${Math.abs(f.c)} แต้ม`);if(f.m)o.push(`เงิน ${f.m>0?"+":"−"}${Math.abs(f.m)} ฿`);if(f.s)o.push(`พอใจ ${f.s>0?"+":"−"}${Math.abs(f.s)}`);if(f.b)o.push(`บั๊ก ${f.b>0?"+":"−"}${Math.abs(f.b)}`);if(f.o)o.push(`โบนัสถาวร +${f.o}`);if(f.vm)o.push(`รอบนี้ ${f.vm} ตอนส่งงาน`);if(f.pb)o.push(`รอบหน้าโบนัส +${f.pb}`);if(f.add)o.push(`เพิ่มงาน ${f.add} แต้มบนสุด`);if(f.cut)o.push(`ตัดงานท้ายรายการ ${f.cut} แต้ม`);if(f.sick)o.push("มีผู้ทดสอบหรือนักออกแบบ: ไม่เสียอะไร · ไม่มี: −2 ตอนส่งงาน");if(f.j!=null)o.push(`${ROLES[f.j].n}ตัดสิน`);if(!o.length)o.push("ไม่มีผล");return o};

/* ================= ENGINE ================= */
function newGame(code,team){const sc=-1;return{v:1,code,team:team||"ทีม "+code,seq:0,ph:"lobby",spr:0,pos:0,rolls:0,m:10,sat:5,bug:0,bon:0,sp:0,commit:0,sc,ord:[0,1,2,3,4,5,6,7],done:[],plan:[],nx:0,pl:[],t:0,rl:-1,ki:0,ei:0,si:0,card:null,dice:null,pw:{},vm:0,pb:0,rv:null,cuPri:-1,ack:{},log:[],ag:{},agd:{},spd:{},ask:0,scrum:false,dod:[],sg:null,ds:null,sgN:0}}
const itemName=(g,i)=>i<8?SCEN[g.sc].b[i][0]:EXTRA[(i-8)%EXTRA.length];
const itemSP=(g,i)=>i<8?SCEN[g.sc].b[i][1]:(g.xsp?.[i]||3);
const remaining=g=>g.ord.filter(i=>!g.done.includes(i));
const hasRole=(g,r)=>g.pl.some(p=>p.r===r);
const roleName=(g,r)=>{const p=g.pl.find(p=>p.r===r);return p?p.n:null};
const L=(g,s)=>{g.log.unshift(s);g.log=g.log.slice(0,5)};
function applyFx(g,f,noNeg){if(!f)return;const keep=v=>noNeg?Math.max(0,v):v;
 if(f.c)g.commit=Math.max(0,g.commit+(noNeg&&f.c<0?0:f.c));
 if(f.m)g.m+=noNeg?Math.max(0,f.m):f.m;
 if(f.s)g.sat=clamp(g.sat+keep(f.s),0,10);
 if(f.b&&!(noNeg&&f.b>0))g.bug=Math.max(0,g.bug+f.b);
 if(f.o)g.bon=clamp(g.bon+f.o,0,3);
 if(f.vm&&!noNeg)g.vm+=f.vm;
 if(f.pb)g.pb+=f.pb;
 if(f.add)addItem(g,f.add,0,true);
 if(f.add2)addItem(g,f.add2,1,false);
 if(f.cut){let left=f.cut;const rem=remaining(g).filter(i=>!g.plan.includes(i));while(left>0&&rem.length){const i=rem.pop();left-=itemSP(g,i);g.ord=g.ord.filter(x=>x!==i)}}
 if(f.sick){if(!(hasRole(g,3)||hasRole(g,6)))g.vm-=2}}
function addItem(g,sp,kind,top){const i=8+kind+3*(g.nx||0);g.nx=(g.nx||0)+1;g.xsp=g.xsp||{};g.xsp[i]=sp;
 if(top){const firstRem=g.ord.findIndex(x=>!g.done.includes(x)&&!g.plan.includes(x));if(firstRem<0)g.ord.push(i);else g.ord.splice(firstRem,0,i)}else g.ord.push(i)}
function startSprint(g,n){g.spr=n;g.pos=(n-1)*10+1;g.m-=2;g.rolls=0;g.plan=[];g.commit=0;g.vm=0;if(g.pb){g.bon=clamp(g.bon+g.pb,0,3);g.pb=0}g.pw.sm=false;g.cuPri=-1;g.card=null;g.rv=null;g.dice=null;g.sg=null;g.ds=null;g.ph="plan";
 if(n===1){const po=g.pl.findIndex(p=>p.r===0);g.t=po>=0?po:0}L(g,`เริ่มรอบ ${n} · จ่ายค่าทีม 2 ฿ (เหลือ ${g.m} ฿)`)}
function draw(g,type){if(type==="K"){const p=perm(KN.length,hash(g.code+"k"));const i=p[g.ki%KN.length];g.ki++;return{t:"K",i}}
 if(type==="E"){const p=perm(EV.length,hash(g.code+"e"));const i=p[g.ei%EV.length];g.ei++;return{t:"E",i}}
 if(type==="S"){const p=perm(SH.length,hash(g.code+"s"));const i=p[g.si%SH.length];g.si++;return{t:"S",i}}
 return{t:"D"}}
function afterCard(g){g.card=null;const R=g.spr*10;if(g.pos<R&&g.rolls>=3){g.pos=R;g.sat=clamp(g.sat-1,0,10);L(g,"ทอยครบ 3 ครั้งยังไม่ถึง R · ย้ายไปส่งงาน ความพอใจ −1");g.ph="review";g.rv={st:0}}else if(g.scrum&&!g.ds&&g.rolls>=1){g.ph="daily";g.ds={st:0,imp:-1};L(g,"ถึงกลางรอบ · ประชุม Daily Scrum")}else g.ph="move"}
function calcScore(g){const ag=Object.values(g.agd||{}).reduce((a,b)=>a+b,0);return g.sp+g.sat+g.m-2*g.bug-(g.m<0?2*Math.abs(g.m):0)+ag}
const DODS=["ทดสอบผ่านทุกกรณีหลัก","ไม่มีบั๊กร้ายแรงค้าง","ลูกค้าดูตัวอย่างการใช้งานแล้ว","มีคู่มือหรือคำอธิบายสั้น ๆ","เพื่อนในทีมตรวจงานแล้ว (Code Review)","ใช้งานบนมือถือได้"];
const IMP=["ไม่มีอุปสรรค","รอคำตอบจากลูกค้า","ไม่เข้าใจงานบางชิ้น","เครื่องมือหรือระบบมีปัญหา","มีงานแทรกจากนอกทีม"];
const SCRUMR=["Product Owner","Scrum Master","Developers","Developers","Stakeholder","Developers","Developers","Stakeholder"];
const STARS=["ไม่ตรงใจ","ขาดหลายอย่าง","พอใช้","ดี","เกินคาด"];
const dodVel=g=>g.scrum?-Math.min(2,Math.max(0,(g.dod||[]).length-3)):0;
const dodBug=g=>{if(!g.scrum)return 0;const k=(g.dod||[]).length;return k<=2?1:k>=4?-1:0};
function agendaIdx(g,r){const h=hash(g.code+"ag");return r===4?h%3:3+(h>>3)%3}

function reduce(g,it,who){g=JSON.parse(JSON.stringify(g));const a=it.a,x=it.x;const nm=who?.n||"ผู้เล่น";
 const ph=g.ph;
 if(typeof a==="string"&&a.slice(0,2)==="cp"&&a!=="cuPri")return reduceCp(g,a,x,who);
 switch(a){
 case"join":{if(!who?.k||who.teacher)break;const p=g.pl.find(p=>p.k===who.k);if(p){p.n=who.n}else if(g.pl.length<8)g.pl.push({k:who.k,n:who.n,r:-1});break}
 case"role":{const p=g.pl.find(p=>p.k===who.k);if(!p)break;if(x===-1||!g.pl.some(q=>q.r===x&&q.k!==who.k))p.r=x;break}
 case"kick":{if(ph==="lobby")g.pl=g.pl.filter(p=>p.k!==x);break}
 case"sc":{if(ph!=="lobby"||!(x>=0&&x<SCEN.length))break;g.sc=x;L(g,`${nm} เลือกโจทย์: ${SCEN[x].t}`);break}
 case"start":{if(ph!=="lobby"||!(g.sc>=0))break;g.ph="vision";g.pl.forEach(p=>{if(p.r===4||p.r===7)g.ag[p.r]=agendaIdx(g,p.r)});L(g,`เริ่มเกม · โจทย์: ${SCEN[g.sc].t}`);break}
 case"move":{if(ph!=="vision"&&ph!=="plan")break;const o=g.ord.filter(i=>!g.done.includes(i)&&!g.plan.includes(i));const k=o.indexOf(x.i);const j=k+x.d;if(k<0||j<0||j>=o.length)break;[o[k],o[j]]=[o[j],o[k]];g.ord=[...g.done.filter(i=>g.ord.includes(i)),...g.plan,...o];break}
 case"toPlan":{if(ph==="vision"&&!(g.scrum&&g.dod.length<2))nextSprint(g,1);break}
 case"pick":{if(ph!=="plan")break;const o=remaining(g);g.plan=o.slice(0,clamp(x,0,o.length));g.commit=g.plan.reduce((s,i)=>s+itemSP(g,i),0);if(!g.plan.includes(g.cuPri))g.cuPri=-1;if(g.sg)g.sg.it=(g.sg.it||[]).filter(i=>g.plan.includes(i));break}
 case"cuPri":{if(ph!=="plan"||g.pw.cu||!hasRole(g,4)||!g.plan.includes(x))break;g.cuPri=x;break}
 case"go":{if(ph!=="plan"||!g.plan.length)break;if(g.scrum&&!(g.sg?.t&&g.sg.it?.length))break;if(g.scrum)L(g,`Sprint Goal: ${g.sg.t}`);if(g.cuPri>=0){g.pw.cu=true;L(g,`ลูกค้าเลือกงานสำคัญ: ${itemName(g,g.cuPri)}`)}L(g,`สัญญา ${g.commit} แต้ม: ${g.plan.map(i=>itemName(g,i)).join(" + ")}`);g.ph="move";break}
 case"roll":{if(ph!=="move")break;const d=r6();g.rolls++;g.rl=g.t;const roller=g.pl[g.t]?.n||nm;g.t=g.pl.length?(g.t+1)%g.pl.length:0;g.dice={d:[d],id:g.seq+1};const R=g.spr*10;let to=g.pos+d;
  if(to>=R){g.pos=R;let msg=`${roller} ทอยได้ ${d} → ถึงช่อง ${R} (ส่งงาน)`;if(g.rolls<=2){g.m+=1;msg+=" · ถึงภายใน 2 ทอย +1 ฿"}L(g,msg);g.ph="review";g.rv={st:0}}
  else{g.pos=to;const ty=CELLTYPE(to);g.card=draw(g,ty);g.card.rl=g.rl;L(g,`${roller} ทอยได้ ${d} → ช่อง ${to} (${CINFO[ty][0]})`);g.ph="card"}break}
 case"kans":{if(ph!=="card"||g.card?.t!=="K"||g.card.ans!=null)break;g.card.ans=x;g.card.ok=x===KN[g.card.i][2];if(!g.card.ok)L(g,"ตอบการ์ดความรู้ผิด · อ่านเฉลยแล้วไปต่อ");break}
 case"krew":{if(g.card?.t!=="K"||!g.card.ok||g.card.rw)break;g.card.rw=x;if(x==="m"){g.m+=1;L(g,`ตอบถูก · เลือกรับ +1 ฿ (เป็น ${g.m} ฿)`)}else{g.bug=Math.max(0,g.bug-1);L(g,"ตอบถูก · เลือกลบบั๊ก 1")}afterCard(g);break}
 case"opt":{if(g.card?.t!=="E"||g.card.res!=null)break;const e=EV[g.card.i];const o=x===0?e.A:e.B;if(!o)break;g.card.ch=x;if(o[1].j!=null){g.card.judge=true;break}applyFx(g,o[1]);g.card.res=fxText(o[1]).join(" · ");L(g,`${e.t}: เลือก ${x===0?"A":"B"} · ${g.card.res}`);break}
 case"judge":{if(!g.card?.judge||g.card.res!=null)break;const e=EV[g.card.i];const o=(g.card.ch===0?e.A:e.B)[1];const f=x?o.yes:o.no;applyFx(g,f);g.card.res=(x?"ยอมรับ · ":"ไม่ยอมรับ · ")+fxText(f).filter(t=>!t.startsWith("เพิ่มงาน")).join(" · ");L(g,`${e.t}: ${g.card.res}`);break}
 case"smCancel":{if(g.card?.t!=="E"||g.card.res!=null||!EV[g.card.i].f||g.pw.sm||!hasRole(g,1))break;g.pw.sm=true;g.card.res="ผู้ดูแลกระบวนการยกเลิกการ์ดนี้ · ไม่มีผล";L(g,`ใช้พลังขจัดอุปสรรค ยกเลิก "${EV[g.card.i].t}"`);break}
 case"poA":{if(g.card?.t!=="E"||g.card.res!=null||!EV[g.card.i].ch||g.pw.po||!hasRole(g,0))break;g.pw.po=true;const f=EV[g.card.i].A[1];applyFx(g,f,true);g.card.ch=0;g.card.res="ใช้พลังยอมรับการเปลี่ยนแปลง: เลือก A โดยไม่รับผลเสีย";L(g,`เจ้าของผลิตภัณฑ์ใช้พลัง · ${EV[g.card.i].t}`);break}
 case"sq":{if(g.card?.t!=="S"||g.card.ans!=null)break;g.card.ans=x;g.card.ok=x===SH[g.card.i][2];g.sat=clamp(g.sat+(g.card.ok?1:-1),0,10);L(g,`ผู้มีส่วนได้ส่วนเสีย "${SH[g.card.i][0]}": ${g.card.ok?"ตอบถูก พอใจ +1":"ตอบผิด พอใจ −1"}`);break}
 case"daily":{if(g.card?.t!=="D"||g.card.res!=null)break;g.card.res=x?1:0;if(x){g.bug=Math.max(0,g.bug-1);L(g,"ประชุมเช้าทันเวลา · ลบบั๊ก 1")}else L(g,"ประชุมเช้าเกินเวลา · ไม่มีผล");break}
 case"next":{if(ph!=="card")break;const c=g.card;if(!c)break;if(c.t==="K"&&c.ans==null)break;if(c.t==="K"&&c.ok&&!c.rw)break;if(c.t==="E"&&c.res==null)break;if(c.t==="S"&&c.ans==null)break;if(c.t==="D"&&c.res==null)break;afterCard(g);break}
 case"rate":{if(ph!=="review"||g.rv.st!==0||g.scrum)break;g.sat=clamp(g.sat+x,0,10);g.rv.rate=x;g.rv.st=1;L(g,`ลูกค้าให้ความพอใจ ${x>0?"+1":x<0?"−1":"0"}`);if(hasRole(g,3)&&g.bug>0){g.bug--;g.rv.qa=1;L(g,`ผู้ทดสอบลบบั๊ก 1 ตัว (เหลือ ${g.bug})`)}break}
 case"ux":{if(ph!=="review"||g.pw.ux||!hasRole(g,6)||g.rv.st<(g.scrum?3:1))break;g.pw.ux=true;g.sat=clamp(g.sat+2,0,10);L(g,"นักออกแบบใช้พลังเข้าใจผู้ใช้ ความพอใจ +2");break}
 case"vroll":{if(ph!=="review"||g.rv.st!==(g.scrum?0:1))break;const d=[r6(),r6()];const pair=hasRole(g,2)&&hasRole(g,5)?1:0;g.rv.d=d;g.rv.pair=pair;g.rv.dv=dodVel(g);g.rv.vel=Math.max(0,d[0]+d[1]+g.bon+pair+g.vm+g.rv.dv-g.bug);g.rv.st=2;g.dice={d,id:g.seq+1};L(g,`ทอยส่งงาน ${d[0]}+${d[1]} → กำลังทำงาน ${g.rv.vel}`);break}
 case"reroll":{if(ph!=="review"||g.rv.st!==2||g.pw.be||!hasRole(g,5))break;g.pw.be=true;const d=[r6(),r6()];g.rv.d=d;g.rv.vel=Math.max(0,d[0]+d[1]+g.bon+g.rv.pair+g.vm+dodVel(g)-g.bug);g.dice={d,id:g.seq+1};L(g,`นักพัฒนาหลังบ้านทอยใหม่ ${d[0]}+${d[1]} → ${g.rv.vel}`);break}
 case"accept":{if(ph!=="review"||g.rv.st!==2)break;const v=g.rv.vel;let got=[];if(v>=g.commit)got=[...g.plan];else{let left=v;for(const i of g.plan){const s=itemSP(g,i);if(s<=left){got.push(i);left-=s}else break}}
  if(g.scrum){const u=clamp(+x||0,0,got.length);g.rv.dodMiss=+x||0;if(u){const back=got.splice(got.length-u,u);g.rv.dodFail=back;L(g,`ไม่ผ่าน DoD ${u} ข้อ · ${back.map(i=>itemName(g,i)).join(", ")} ยังไม่นับว่าเสร็จ`)}}
  const pts=got.reduce((s,i)=>s+itemSP(g,i),0);g.sp+=pts;g.done.push(...got);g.rv.got=got;g.rv.pts=pts;
  const rest=g.plan.filter(i=>!got.includes(i));g.ord=[...g.done,...rest,...g.ord.filter(i=>!g.done.includes(i)&&!rest.includes(i))];
  if(g.cuPri>=0&&got.includes(g.cuPri)){g.sat=clamp(g.sat+2,0,10);L(g,"งานสำคัญของลูกค้าเสร็จ ความพอใจ +2")}
  L(g,v>=g.commit?`${v} ≥ ${g.commit} งานเสร็จครบ +${pts} แต้ม`:`${v} < ${g.commit} ได้ ${pts} แต้ม งานที่เหลือไปรอบหน้า`);
  if(g.scrum){const gi=g.sg?.it||[];const ok=gi.length>0&&gi.every(i=>got.includes(i));g.rv.goal=ok;if(ok){g.sgN=(g.sgN||0)+1;g.sat=clamp(g.sat+2,0,10)}else g.sat=clamp(g.sat-1,0,10);L(g,ok?"บรรลุ Sprint Goal · ความพอใจ +2":"ไม่บรรลุ Sprint Goal · ความพอใจ −1");
   const db=dodBug(g);if(db&&!(db<0&&g.bug===0)){g.bug=Math.max(0,g.bug+db);g.rv.db=db;L(g,db>0?"DoD หลวมเกินไป · หนี้ทางเทคนิค บั๊ก +1":"DoD เข้มงวด · คุณภาพดี บั๊ก −1")}g.rv.st=3;g.plan=[];break}
  g.ph="retro";g.plan=[];break}
 case"retro":{if(ph!=="retro")break;if(x){g.bon=clamp(g.bon+1,0,3);L(g,`ข้อเสนอปรับปรุงเป็นรูปธรรม · โบนัสถาวร ${g.bon}`)}else L(g,"ข้อเสนอยังไม่เป็นรูปธรรม · ไม่ได้โบนัส");
  if(g.spr<4)nextSprint(g,g.spr+1);else{g.ph="end";g.pos=41;
   Object.entries(g.ag).forEach(([r,i])=>{const A=AG[i];if(A.auto==="bud")g.agd[r]=g.m>=3?3:g.m<0?-3:0;if(A.auto==="bug")g.agd[r]=g.bug<=1?3:0});L(g,"จบเกม · นับคะแนน")}break}
 case"agd":{if(ph!=="end")break;g.agd[x.r]=x.v;break}
 case"spAsk":{if(g.pw.sp||!hasRole(g,7)||ph==="lobby"||ph==="end")break;g.ask=1;L(g,"ทีมขอเงินเพิ่มจากผู้สนับสนุน");break}
 case"spDec":{if(!g.ask)break;g.ask=0;if(x){g.pw.sp=true;g.m+=3;L(g,`ผู้สนับสนุนอนุมัติ +3 ฿ (เป็น ${g.m} ฿)`)}else L(g,"ผู้สนับสนุนยังไม่อนุมัติ");break}
 case"mode":{if(ph!=="lobby")break;g.scrum=!!x;L(g,`${nm} เลือกโหมด: ${x?"บทที่ 6 Scrum เต็มรูปแบบ":"บทที่ 1 อไจล์พื้นฐาน"}`);break}
 case"dod":{if(!g.scrum||(ph!=="vision"&&ph!=="retro"))break;const l=(x?.l||[]).map(s=>String(s).trim().slice(0,60)).filter(Boolean).slice(0,8);if(l.length<2)break;g.dod=l;if(x.pg!=null)g.pg=String(x.pg).slice(0,100);L(g,`${ph==="retro"?"ปรับ":"ตั้ง"} Definition of Done ${l.length} ข้อ`);break}

function cpQ(g){const acts=cpNet(g),c=cpCalc(acts,a=>a.m);
 const nonc=CP_IDS.filter(id=>!c.crit[id]).sort((x,y)=>c.TF[y]-c.TF[x]||x.localeCompare(y));const fl=nonc[0]||"H";
 const cpl=CP_IDS.filter(id=>c.crit[id]);const p1=cpl.find(id=>acts[id].o!==acts[id].m)||cpl[0];const p2=cpl.filter(id=>id!==p1).sort((x,y)=>acts[y].m-acts[x].m)[0]||cpl[1];
 const teD=Math.round(cpl.reduce((s,id)=>s+te(acts[id]),0)*10)/10;
 const gq=CP_IDS.filter(id=>c.ES[id]>0).sort((x,y)=>c.ES[y]-c.ES[x]||x.localeCompare(y))[1]||"G";
 return{acts,c,fl,p1,p2,teD,gq,cpl}}
const CP_QS={dur:"ระยะเวลาโครงการ",cp:"เส้นทางวิกฤต",fl:"เวลาสำรอง",te1:"Te กิจกรรมที่ 1",te2:"Te กิจกรรมที่ 2",ted:"ระยะเวลาคาดหมาย (PERT)",gs:"อ่าน Gantt"};
function cpCheck(g,q,v){const Q=cpQ(g);
 if(q==="dur")return +v===Q.c.D;
 if(q==="fl")return +v===Q.c.TF[Q.fl];
 if(q==="cp"){const s=String(v||"").split("").sort().join("");return s===Q.cpl.join("")}
 if(q==="te1")return Math.abs(+v-te(Q.acts[Q.p1]))<=0.06;
 if(q==="te2")return Math.abs(+v-te(Q.acts[Q.p2]))<=0.06;
 if(q==="ted")return Math.abs(+v-Q.teD)<=0.16;
 if(q==="gs")return +v===Q.c.ES[Q.gq]+1;
 return false}
const FIB=[1,2,3,5,8,13];
const fibIdx=v=>{let b=0;FIB.forEach((f,i)=>{if(Math.abs(f-v)<Math.abs(FIB[b]-v))b=i});return b};
function pkStories(g){const S=SCEN[Math.max(0,g.sc)];return[3,4,5,6].map(i=>({n:S.b[i][0],ref:S.b[i][1]}))}
function cpScores(g){const cp=g.cp||{},a=cp.a||{};const pt=q=>a[q]?.ok?(a[q].t<=1?1:0.5):0;
 const quiz=Math.round(["dur","cp","fl","te1","te2","ted"].reduce((s,q)=>s+pt(q),0)/6*4*100)/100;
 const wbs=Math.round(((cp.wbsOk||0)/10*1.5+pt("gs"))*100)/100;
 const st=pkStories(g);let fin=0,cons=0,close=0;st.forEach((s,i)=>{const p=cp.pk?.["s"+i];if(p?.fin){fin++;if(p.cons)cons++;if(Math.abs(fibIdx(p.fin)-fibIdx(s.ref))<=1)close++}});
 const poker=Math.round((fin/4*0.5+cons/4*0.5+close/4*0.5)*100)/100;
 return{quiz,wbs,poker,total:Math.round((quiz+wbs+poker)*100)/100,game:cp.sim?.ok?1:0}}

/* ---------- reducer for the CPM module (called from reduce) ---------- */
function reduceCp(g,a,x,who){const nm=who?.n||"?";if(a!=="cpStart"&&!g.cp)return g;if(!g.cp)g.cp={};const cp=g.cp;cp.a=cp.a||{};if(a!=="cpStart"&&cp.st==null)return g;
 switch(a){
 case"cpStart":{if(!(g.sc>=0))break;if(!g.cp||g.cp.st==null)g.cp={st:0,a:{}};L(g,`${nm} เริ่ม Critical Path Rush`);break}
 case"cpWbs":{if(cp.st!==0||cp.wbsOk!=null)break;const acts=cpNet(g);let ok=0;const w={};for(const id of CP_IDS){const v=+(x?.[id]);w[id]=isNaN(v)?-1:v;if(w[id]===acts[id].grp)ok++}cp.wbs=w;cp.wbsOk=ok;L(g,`${nm} ส่ง WBS · ถูก ${ok}/10`);break}
 case"cpAns":{const q=x?.q;if(!CP_QS[q])break;const cur=cp.a[q]||{t:0};if(cur.ok||cur.t>=2)break;const need={dur:1,cp:1,fl:1,te1:2,te2:2,ted:2,gs:3}[q];if(cp.st!==need)break;
  cur.t++;cur.by=who?.k||"";cur.v=String(x.v);cur.ok=cpCheck(g,q,x.v);cp.a[q]=cur;L(g,`${nm} ตอบ${CP_QS[q]}: ${cur.ok?"ถูก":"ยังไม่ถูก"}${!cur.ok&&cur.t<2?" (ลองได้อีก 1 ครั้ง)":""}`);break}
 case"cpCrash":{if(cp.st!==2||cp.sim)break;cp.cr=cp.cr||{};const id=String(x);if(!CP_IDS.includes(id))break;const used=Object.values(cp.cr).reduce((s,v)=>s+v,0);
  if(cp.cr[id]){delete cp.cr[id];break}if(used>=3)break;cp.cr[id]=1;break}
 case"cpSim":{if(cp.st!==2||cp.sim||!["te1","te2","ted"].every(q=>cp.a[q]?.ok||cp.a[q]?.t>=2))break;const Q=cpQ(g);const d={};
  for(const id of CP_IDS){const A=Q.acts[id];const u=(Math.random()+Math.random())/2;d[id]=Math.max(1,Math.round(A.o+u*(A.p-A.o))-(cp.cr?.[id]?1:0))}
  const evA=CP_IDS[Math.floor(Math.random()*10)];d[evA]+=2;const c=cpCalc(Q.acts,A=>d[A.id]);const dl=Math.ceil(Q.teD)+1;
  cp.sim={d,ev:evA,dur:c.D,dl,ok:c.D<=dl?1:0,crit:c.crit};L(g,`ทอยเวลาจริง · โครงการใช้ ${c.D} วัน (เส้นตาย ${dl} วัน) ${c.D<=dl?"ทันกำหนด":"ล่าช้า"}`);break}
 case"cpVote":{if(cp.st!==4||!who?.k||who.k==="teacher")break;const i=cp.pi||0;const k="s"+i;cp.pk=cp.pk||{};const p=cp.pk[k]=cp.pk[k]||{r:1,v:{}};if(p.rev||p.fin)break;if(!FIB.includes(+x))break;p.v=p.v||{};p.v[who.k]=+x;break}
 case"cpReveal":{if(cp.st!==4)break;const k="s"+(cp.pi||0);const p=cp.pk?.[k];if(!p||p.rev||!Object.keys(p.v||{}).length)break;p.rev=1;const vs=Object.values(p.v).map(Number).sort((a,b)=>a-b);
  const span=fibIdx(vs[vs.length-1])-fibIdx(vs[0]);p.cons=span<=1?1:0;if(p.cons||p.r>=2){p.fin=FIB[fibIdx(vs[Math.floor((vs.length-1)/2)])];}
  L(g,`เปิดไพ่: ${vs.join(", ")}${p.cons?" · เห็นตรงกัน":p.fin?" · ใช้ค่ากลาง "+p.fin:" · ต่างกันมาก คุยแล้วโหวตใหม่"}`);break}
 case"cpRevote":{const k="s"+(cp.pi||0);const p=cp.pk?.[k];if(!p||!p.rev||p.fin)break;p.r=2;p.rev=0;p.v={};break}
 case"cpPkNext":{const k="s"+(cp.pi||0);if(!cp.pk?.[k]?.fin)break;cp.pi=(cp.pi||0)+1;if(cp.pi>=4){cp.st=5;L(g,"จบ Critical Path Rush · บันทึกลงแฟ้มสะสมงานแล้ว")}break}
 case"cpNext":{const done={0:cp.wbsOk!=null,1:["dur","cp","fl"].every(q=>cp.a[q]?.ok||cp.a[q]?.t>=2),2:!!cp.sim,3:cp.a.gs?.ok||cp.a.gs?.t>=2}[cp.st];if(!done)break;cp.st++;if(cp.st===4)cp.pi=0;break}
 }
 return g}

/* ---------- SVG: network & Gantt ---------- */
function netSvg(g,show){const Q=cpQ(g),A=Q.acts,c=Q.c;const ed=[];
 for(const id of CP_IDS)for(const p of A[id].pre)ed.push([p,id]);
 const W=70,H=46;let s=`<svg viewBox="0 0 660 250" class="net" role="img" aria-label="แผนภาพเครือข่ายกิจกรรม"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>`;
 for(const [a,b] of ed){const [x1,y1]=CP_POS[a],[x2,y2]=CP_POS[b];const cr=show&&c.crit[a]&&c.crit[b];s+=`<line x1="${x1+W/2}" y1="${y1}" x2="${x2-W/2-2}" y2="${y2}" class="${cr?"ecr":"ed"}" marker-end="url(#ah)"/>`}
 for(const id of CP_IDS){const [x,y]=CP_POS[id];const cr=show&&c.crit[id];s+=`<g class="${cr?"ncr":"nd"}"><rect x="${x-W/2}" y="${y-H/2}" width="${W}" height="${H}" rx="8"/><text x="${x}" y="${y-6}" text-anchor="middle" class="nid">${id}</text><text x="${x}" y="${y+12}" text-anchor="middle" class="nd2">${show?`${c.ES[id]}–${c.EF[id]} · สำรอง ${c.TF[id]}`:`${A[id].m} วัน`}</text></g>`}
 return s+`</svg>`}
function ganttSvg(g){const Q=cpQ(g),A=Q.acts,c=Q.c;const D=c.D,L0=128,R=452,u=(R-L0)/D,rh=28;let s=`<svg viewBox="0 0 460 ${40+rh*10}" class="gantt" role="img" aria-label="แผนภูมิแกนต์">`;
 for(let d=0;d<=D;d++){const x=L0+d*u;s+=`<line x1="${x}" y1="22" x2="${x}" y2="${28+rh*10}" class="gl"/>`;if(d<D&&(d%2===0||D<=12))s+=`<text x="${x+u/2}" y="16" text-anchor="middle" class="gt">${d+1}</text>`}
 CP_IDS.forEach((id,i)=>{const y=28+i*rh;const cr=c.crit[id];s+=`<text x="4" y="${y+15}" class="gn">${id} ${esc(A[id].n.replace("พัฒนา: ","").slice(0,11))}</text>`;
  if(!cr&&c.TF[id]>0)s+=`<rect x="${L0+c.EF[id]*u}" y="${y+6}" width="${c.TF[id]*u}" height="${rh-12}" rx="3" class="gfl"/>`;
  s+=`<rect x="${L0+c.ES[id]*u}" y="${y+3}" width="${A[id].m*u}" height="${rh-6}" rx="4" class="${cr?"gcr":"gb"}"/>`});
 return s+`</svg>`}

/* generic SVGs (acts + calc + position map); st: {es:Set of shown forward ids, ls:Set backward, cp:bool, hi:id} */
function netA(acts,c,pos,st={},W0=680){const W=72,H=48;let s=`<svg viewBox="0 0 ${W0} 250" class="net" role="img" aria-label="แผนภาพเครือข่ายกิจกรรม"><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>`;
 for(const id of CP_IDS)for(const p of acts[id].pre){const [x1,y1]=pos[p],[x2,y2]=pos[id];const cr=st.cp&&c.crit[p]&&c.crit[id];s+=`<line x1="${x1+W/2}" y1="${y1}" x2="${x2-W/2-2}" y2="${y2}" class="${cr?"ecr":"ed"}" marker-end="url(#ah2)"/>`}
 for(const id of CP_IDS){const [x,y]=pos[id];const cr=st.cp&&c.crit[id];const f=st.es?.has(id),b=st.ls?.has(id);const hi=st.hi===id;
  s+=`<g class="${cr?"ncr":"nd"}${hi?" nhi":""}"><rect x="${x-W/2}" y="${y-H/2}" width="${W}" height="${H}" rx="8"/><text x="${x}" y="${y-9}" text-anchor="middle" class="nid">${id} · ${acts[id].m}</text>`+
  `<text x="${x}" y="${y+6}" text-anchor="middle" class="nd2">${f?`ES ${c.ES[id]} · EF ${c.EF[id]}`:"ES – · EF –"}</text><text x="${x}" y="${y+19}" text-anchor="middle" class="nd2">${b?`LS ${c.LS[id]} · LF ${c.LF[id]}`:"LS – · LF –"}</text></g>`}
 return s+`</svg>`}
function ganttA(acts,c,unit="",dur=a=>a.m){const D=c.D,L0=130,R=452,u=(R-L0)/D,rh=28;let s=`<svg viewBox="0 0 460 ${40+rh*10}" class="gantt" role="img" aria-label="แผนภูมิแกนต์">`;
 for(let d=0;d<=D;d++){const x=L0+d*u;s+=`<line x1="${x}" y1="22" x2="${x}" y2="${28+rh*10}" class="gl"/>`;if(d<D&&(d%2===0||D<=12))s+=`<text x="${x+u/2}" y="16" text-anchor="middle" class="gt">${d+1}</text>`}
 CP_IDS.forEach((id,i)=>{const y=28+i*rh;const cr=c.crit[id];s+=`<text x="4" y="${y+17}" class="gn">${id} ${esc(acts[id].n.replace("พัฒนา: ","").slice(0,12))}</text>`;
  if(!cr&&c.TF[id]>0)s+=`<rect x="${L0+c.EF[id]*u}" y="${y+7}" width="${c.TF[id]*u}" height="${rh-14}" rx="3" class="gfl"/>`;
  s+=`<rect x="${L0+c.ES[id]*u}" y="${y+4}" width="${dur(acts[id])*u}" height="${rh-8}" rx="4" class="${cr?"gcr":"gb"}"/>`});return s+`</svg>`}
const r2=x=>Math.round(x*100)/100;

function fwdWhy(id){const a=SB.acts[id];if(!a.pre.length)return`${id} ไม่มีงานก่อนหน้า จึงเริ่มสัปดาห์ 0 · EF = 0 + ${a.m} = ${SBC.EF[id]}`;
 const ps=a.pre.map(p=>`EF(${p}) = ${SBC.EF[p]}`).join(", ");return a.pre.length>1?`${id} ต้องรอ ${a.pre.join(" และ ")} เสร็จทั้งหมด → ES = max(${ps}) = <b>${SBC.ES[id]}</b> · EF = ${SBC.ES[id]} + ${a.m} = ${SBC.EF[id]}`:`ES(${id}) = ${ps.split(" = ")[1]} · EF = ${SBC.ES[id]} + ${a.m} = ${SBC.EF[id]}`}
function bwdWhy(id){const succ=CP_IDS.filter(s=>SB.acts[s].pre.includes(id));if(!succ.length)return`${id} เป็นงานสุดท้าย LF = ระยะเวลาโครงการ = ${SBC.D} · LS = ${SBC.D} − ${SB.acts[id].m} = ${SBC.LS[id]}`;
 const ss=succ.map(s=>`LS(${s}) = ${SBC.LS[s]}`).join(", ");return`${succ.length>1?`${id} มีงานถัดไปหลายงาน → LF = min(${ss}) = <b>${SBC.LF[id]}</b>`:`LF(${id}) = ${ss}`} · LS = ${SBC.LF[id]} − ${SB.acts[id].m} = ${SBC.LS[id]} · เวลาสำรอง = ${SBC.LS[id]} − ${SBC.ES[id]} = <b>${SBC.TF[id]}</b>`}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px;background:#b8c1cc}
.dot.on{background:#2e9e5b}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip,#eef2f6);color:var(--muted,#6b7785);margin-left:4px;font-weight:500;vertical-align:1px}
.wzs{display:flex;gap:6px;margin:4px 0 2px}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.rpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rpick button{padding:12px 8px;border-radius:12px;font-size:14.5px;line-height:1.25}
.rpick button small{display:block;font-size:12px;color:var(--muted,#6b7785);font-weight:400}

.rlist .rl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line,#e3e8ee)}
.rlist .rl:last-child{border-bottom:0}

.wznav{display:flex;gap:8px}.wznav button{flex:1}
.bigdice{font-size:18px}

  ${c.ans!=null?`<p class="res ${c.ok?"good":"bad"}">${c.ok?"ถูกต้อง!":"ยังไม่ถูก"} · ${esc(k[3])}</p>${c.ok?`<div class="g2"><button class="pri" data-a="krew" data-x="m"${busy()}>รับ +1 ฿</button><button class="pri" data-a="krew" data-x="b"${g.bug?"":" disabled"}${busy()}>ลบบั๊ก 1</button></div>`:`<button class="pri big" data-a="next"${busy()}>ไปต่อ</button>`}`:""}</div></div>`}
 if(c.t==="E"){const e=EV[c.i];const done=c.res!=null;const opt=(o,j)=>o?`<button class="opt" data-a="opt" data-x="${j}"${done||c.judge?" disabled":""}${busy()} ${c.ch===j?'style="outline:2.5px solid var(--e)"':""}><span class="ab">${"AB"[j]}</span><span><b>${esc(o[0])}</b><span class="fx">${fxText(o[1]).map(t=>`<span>${esc(t)}</span>`).join("")}</span></span></button>`:"";

  ${opt(e.A,0)}${opt(e.B,1)}${e.n?`<div class="muted" style="font-size:13px">💡 ${esc(e.n)}</div>`:""}

  ${!done&&!c.judge&&e.ch&&hasRole(g,0)&&!g.pw.po?`<button data-a="poA"${busy()}>★ เจ้าของผลิตภัณฑ์: เลือก A โดยไม่รับผลเสีย (1 ครั้งต่อเกม)</button>`:""}
  ${c.judge&&!done?(()=>{const o=(c.ch===0?e.A:e.B)[1];return`<p class="res neu">${esc(o.q)}<br><span class="muted" style="font-size:13px">ให้ ${esc(roleName(g,o.j)||ROLES[o.j].n+" (ผู้สอน)")} ตัดสิน</span></p><div class="g2"><button class="pri" data-a="judge" data-x="1"${busy()}>ยอมรับ (${fxText(o.yes)[0]})</button><button data-a="judge" data-x="0"${busy()}>ไม่ยอมรับ (${fxText(o.no)[0]})</button></div>`})():""}

 $("bRole").onclick=()=>{const r=myRole();if(MODE==="local"){openSheet(`<div class="sh"><h2>บทบาทในทีม</h2><button onclick="closeSheet()">ปิด</button></div>${G.pl.map(p=>p.r>=0?`<div class="pow" style="margin-bottom:8px"><b style="color:${ROLES[p.r].c}">${esc(p.n)} · ${ROLES[p.r].n}</b><div>★ ${ROLES[p.r].pow}: ${ROLES[p.r].pd}</div></div>`:"").join("")}${Object.entries(G.ag).map(([r,i])=>`<details style="margin-top:6px"><summary>วาระลับของ${ROLES[r].n} (ให้เจ้าของบทเปิดดูคนเดียว)</summary><p><b>${esc(AG[i].t)}</b>: ${esc(AG[i].s)}</p></details>`).join("")}`);return}
  if(r<0){toast("คุณยังไม่ได้เลือกบทบาท");return}showRole(r);if(G.ag[r]!=null)$("sheetBody").insertAdjacentHTML("beforeend",`<div class="pow" style="margin-top:10px;background:var(--es)"><b>วาระลับ (เห็นคนเดียว)</b><div>${esc(AG[G.ag[r]].t)}: ${esc(AG[G.ag[r]].s)}</div><div class="muted" style="font-size:13px">${esc(AG[G.ag[r]].w)}</div></div>`)};
 $("bRules").onclick=()=>G.scrum?openSheet(`<div class="sh"><h2>กติกา Scrum</h2><button onclick="closeSheet()">ปิด</button></div><ol style="padding-left:1.2em;margin:0;display:grid;gap:6px">
  <li><b>ก่อนเริ่ม:</b> Product Owner เรียง Product Backlog · ทีมตั้ง Definition of Done อย่างน้อย 2 ข้อ (ยิ่งเข้มยิ่งช้า แต่บั๊กน้อย)</li>
  <li><b>Sprint Planning:</b> จ่าย 2 ฿ เลือกงานจากบนสุด (Sprint Backlog) ตั้ง Sprint Goal และเลือกงานที่ต้องเสร็จเพื่อให้ถึงเป้าหมาย</li>
  <li><b>Sprint:</b> ผลัดกันทอย ไม่เกิน 3 ครั้ง ต้องหยุดที่ R · หลังทอยครั้งแรกมี <b>Daily Scrum</b> แจ้งอุปสรรค (มี Scrum Master +1 ไม่มี −1) และตัดงานนอกเป้าหมายได้</li>
